name: Feature request
description: Suggest a capability for Anubis
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the situation you are in, not the solution you have in mind.
        It is easier to find a design together once the problem is clear.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Anubis to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Including workarounds you are using today.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Where would this change live?
      options:
        - Review quality (prompts, agent behavior)
        - GitHub Action packaging
        - CLI
        - New provider or platform support
        - Not sure
    validations:
      required: false
