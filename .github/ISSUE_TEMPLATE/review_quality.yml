name: Prompt or review quality
description: Anubis produced a finding you believe is wrong, or missed one you expected
labels: [quality]
body:
  - type: markdown
    attributes:
      value: |
        This is for the *content* of reviews, not for crashes.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is this?
      options:
        - False positive — a finding that is not a real problem
        - Missed finding — a real problem Anubis should have reported
        - Wrong severity
        - Duplicated or contradictory findings
        - Wrong or unhelpful formatting
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: What happened?
      description: |
        Quote the finding and the diff hunk it refers to, and explain what is
        wrong. A concrete counter-example is the most useful thing you can give.
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model used
      placeholder: big-pickle
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: |
            I understand reviews are generated by a model and are not verified,
            and that a single report may not be reproducible.
