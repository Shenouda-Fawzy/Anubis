name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: test -z "$(gofmt -l cmd)"

      - name: go vet
        run: go vet ./...

      # The suite is hermetic: it uses local httptest servers for GitHub and the
      # model provider, so no secrets or network access are required.
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: go test (coverage)
        run: go tool cover -func=coverage.out

      # A hand-edited module cache makes a build succeed locally and fail in
      # CI, which is a confusing way to discover that the code only ever
      # compiled against a patched dependency.
      - name: go mod verify
        run: go mod verify

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        # v6 of this action drives golangci-lint v1, but .golangci.yml is a
        # version 2 config, so v6 could never read it. v7+ supports v2.
        # The linter is pinned to a minor series rather than 'latest' so a
        # release cannot turn the build red without a config change here.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub builds the runtime image from this Dockerfile for every action
      # run, so a broken build breaks everyone's workflows.
      - name: Build image
        run: docker build -t anubis:test .

      - name: Smoke test
        run: |
          set -euo pipefail
          container=$(docker create anubis:test)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          # With no arguments the CLI must fail with usage, not a crash.
          if docker run --rm anubis:test >/dev/null 2>&1; then
            echo "expected a non-zero exit without -repo/-pr" >&2
            exit 1
          fi
          docker run --rm anubis:test -h 2>&1 | grep -q -- "-llm-base-url"
