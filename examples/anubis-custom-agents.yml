name: Anubis PR review (custom agents)

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  anubis:
    runs-on: ubuntu-latest
    steps:
      # Required to read the Markdown agents committed to this repository.
      - uses: actions/checkout@v4

      - uses: Shenouda-Fawzy/Anubis@v1
        with:
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          # Load review agents from a directory in this repo instead of the
          # built-in ones. Resolved from the repository root; copy the sample
          # files from examples/agents/ here (or point at examples/agents).
          agents-dir: .github/anubis/agents
          publish: "true"