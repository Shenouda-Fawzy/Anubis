name: 'Anubis PR review'
# The GitHub Marketplace caps this at 125 characters for a Docker action and
# refuses the listing otherwise. Keep it short; the README carries the detail.
description: 'Panel of AI reviewers for pull requests: specialists review the diff, a coordinator dedupes findings.'
author: 'Shenouda Fawzy'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  github-token:
    description: >-
      Token used to read the pull request and post the review comment.
      Needs pull-requests: write to publish.
    required: false
    default: ${{ github.token }}
  repo:
    description: 'Repository in owner/name form. Leave empty to use the repository running the workflow.'
    required: false
    default: ${{ github.repository }}
  pr:
    description: 'Pull request number to review. Defaults to the pull request that triggered the workflow.'
    required: false
    default: ${{ github.event.pull_request.number }}
  publish:
    description: 'Post the review as a pull-request comment.'
    required: false
    default: 'true'
  anubis-llm-model:
    description: 'Chat model identifier passed to the OpenAI-compatible endpoint.'
    required: false
    default: 'big-pickle'
  anubis-llm-base-url:
    description: 'OpenAI-compatible /chat/completions base URL.'
    required: false
    default: 'https://opencode.ai/zen/v1'
  github-base-url:
    description: 'GitHub API base URL. Leave empty to auto-detect, which is correct for both github.com and GitHub Enterprise. Override only if auto-detection is wrong.'
    required: false
    default: ${{ github.api_url }}
  anubis-llm-api-key:
    description: 'Bearer token for the model endpoint. Works with any OpenAI-compatible provider; see docs/providers.md for the base URL of each one.'
    required: false
    default: ''
  anubis-log-level:
    description: 'Log verbosity: debug, info, warn or error. Note that debug still never logs diff content.'
    required: false
    default: 'info'
  anubis-max-concurrency:
    description: 'How many specialist reviewers may run at once. The default of 1 runs them one after another, which is the gentlest option for a provider rate limit. Raise it to reduce wall-clock time at the cost of parallel requests.'
    required: false
    default: '1'
  anubis-agents:
    description: 'Load review agents from .anubis-agents/ at the repository root on the default branch. When the directory has at least one valid *.md file it replaces the built-in specialists; a master-agent.md there overrides the coordinator. Never read from the pull-request head.'
    required: false
    default: 'false'

runs:
  using: 'docker'
  image: 'Dockerfile'
  # Two conventions hold this block together. Every input and variable Anubis owns
  # is prefixed anubis-/ANUBIS_, so nothing here can collide with a caller's
  # environment and the provider is never named: one client, many providers. The
  # GitHub-side names (github-token, repo, pr, publish, github-base-url) and the
  # GITHUB_* variables are GitHub's own contract, set by the runner and read by
  # convention across the ecosystem, so they are deliberately not prefixed.
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    GITHUB_REPOSITORY: ${{ inputs.repo }}
    GITHUB_API_URL: ${{ inputs.github-base-url }}
    ANUBIS_LLM_MODEL: ${{ inputs.anubis-llm-model }}
    ANUBIS_LLM_BASE_URL: ${{ inputs.anubis-llm-base-url }}
    ANUBIS_LOG_LEVEL: ${{ inputs.anubis-log-level }}
    ANUBIS_MAX_CONCURRENCY: ${{ inputs.anubis-max-concurrency }}
    ANUBIS_AGENTS: ${{ inputs.anubis-agents }}
    ANUBIS_LLM_API_KEY: ${{ inputs.anubis-llm-api-key }}
  args:
    # -pr and -publish have no environment fallback; everything else is passed
    # as an environment variable above. Keeping one source of truth per setting
    # means the two can never disagree.
    - -pr=${{ inputs.pr }}
    - -publish=${{ inputs.publish }}
